# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: pip # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
    # Batch version bumps into two PRs a month instead of one per package.
    # Vulnerable transitive dependencies are handled by Dependabot security
    # updates, which key off the alert and ignore the allow/groups config.
    groups:
      production-dependencies:
        dependency-type: "production"
      dev-dependencies:
        dependency-type: "development"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
